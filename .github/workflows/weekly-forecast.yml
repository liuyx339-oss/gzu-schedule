name: Weekly Forecast Update

on:
  schedule:
    - cron: '0 0 * * 1'   # Every Monday at 00:00 UTC (08:00 Beijing)
  workflow_dispatch:

jobs:
  weekly-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-prophet-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-prophet-${{ runner.os }}-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install prophet lightgbm pandas numpy requests

      - name: Run weekly forecast
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: python weekly_forecast.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          keep_files: true
