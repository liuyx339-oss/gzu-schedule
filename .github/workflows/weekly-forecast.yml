name: Weekly Forecast Update

on:
  schedule:
    - cron: '0 0 * * 1'   # Every Monday at 00:00 UTC (08:00 Beijing)
  workflow_dispatch:

jobs:
  weekly-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pandas

      - name: Run weekly forecast (slice from monthly CSV)
        run: python weekly_forecast.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          keep_files: true
